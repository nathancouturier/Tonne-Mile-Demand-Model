name: Ad hoc remote script

on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/adhoc_trigger.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adhoc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Run script
        run: python scripts/adhoc.py
      - name: Commit output
        if: always()
        run: |
          bash scripts/commit_data.sh "adhoc: results" .adhoc
