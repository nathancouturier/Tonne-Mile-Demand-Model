name: Remote source probe

on:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/remote-probe.yml"
      - "scripts/probe_sources.py"
      - "scripts/probe_trigger.txt"
  workflow_dispatch:
    inputs:
      script:
        description: Probe script to run
        required: false
        default: scripts/probe_sources.py
      outdir:
        description: Output directory committed back to the branch
        required: false
        default: .probe

permissions:
  contents: write

concurrency:
  group: remote-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet requests==2.32.3 py7zr==0.22.0
      - name: Run probe
        env:
          PROBE_OUTDIR: ${{ inputs.outdir || '.probe' }}
        run: python ${{ inputs.script || 'scripts/probe_sources.py' }}
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "${{ inputs.outdir || '.probe' }}"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "probe: results from $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          exit 1
