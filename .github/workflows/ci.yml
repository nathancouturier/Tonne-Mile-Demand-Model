name: CI

on:
  push:
    branches: ["**"]
    # data and build outputs are committed by the refresh workflow; CI checks code only
    paths-ignore:
      - ".probe/**"
      - "data/**"
      - "docs/**"
      - "site/data/**"
      - "README.md"
      - "scripts/*_trigger.txt"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest -q
